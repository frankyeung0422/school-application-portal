name: CI

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'web/**'
      - 'tradingagents/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/ci.yml'
  push:
    branches: [main, master]
    paths:
      - 'web/**'
      - 'tradingagents/**'
      - 'tests/**'

jobs:
  pytest:
    name: pytest (paper-trading core)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install minimal deps for the paper-trading test suite
        # We deliberately do NOT pip install -r requirements.txt — that file
        # pulls 50+ heavy deps (langchain, chromadb, etc.) the paper-trading
        # tests don't need. Listing just what tests/test_paper_trading_*.py
        # and tests/test_observability/auth/config.py actually import keeps
        # CI under 2 minutes vs ~10 with the full install.
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pandas yfinance passlib bcrypt python-dotenv prometheus_client

      - name: Run the paper-trading + foundation test suite
        env:
          PYTHONPATH: web
          PYTHONIOENCODING: utf-8
        run: |
          python -m pytest -x --tb=short \
            tests/test_paper_trading_safety.py \
            tests/test_paper_trading_realism.py \
            tests/test_paper_trading_data_hardening.py \
            tests/test_paper_trading_strategy_quality.py \
            tests/test_paper_trading_telemetry.py \
            tests/test_observability.py \
            tests/test_auth_security.py \
            tests/test_config.py

  lint:
    name: ruff (lint web/)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Lint web/modules and tests
        # Scope: only the paper-trading enterprise modules + their tests.
        # The legacy web/api.py and tradingagents/ subtree have pre-existing
        # style issues that aren't worth blocking PRs over today.
        run: |
          ruff check \
            web/modules/paper_trading.py \
            web/modules/autotrade_sim.py \
            web/modules/observability.py \
            web/modules/config.py \
            web/modules/notify.py \
            tests/test_paper_trading_safety.py \
            tests/test_paper_trading_realism.py \
            tests/test_paper_trading_data_hardening.py \
            tests/test_paper_trading_strategy_quality.py \
            tests/test_paper_trading_telemetry.py \
            tests/test_observability.py \
            tests/test_config.py
