  </text>

  <!-- Big CTA button -->
  <rect x="180" y="900" width="720" height="120" rx="60" fill="#10b981"/>
  <text x="540" y="978" font-family="'Source Han Sans TC',sans-serif" font-size="44" fill="#ffffff" font-weight="800" text-anchor="middle">
    <!-- EDIT: CTA -->立即註冊 → evidencebasedtcm.com
  </text>

  <!-- Bottom note -->
  <text x="540" y="1055" font-family="'Source Han Sans TC',sans-serif" font-size="20" fill="#94a3b8" font-weight="400" text-anchor="middle">
